<!DOCTYPE html>

    <!-- 引入 Tailwind CSS 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
        .grid-container { display: grid; gap: 1rem; }
        .slot-card { cursor: pointer; padding: 0.75rem; border-radius: 0.75rem; border-width: 1px; border-style: solid; transition: all 0.2s; }
        .slot-card:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .btn-action { transition: all 0.2s; cursor: pointer; }
        .btn-action:hover { opacity: 0.9; }
        .modal-backdrop { position: fixed; inset: 0; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .modal-backdrop.flex { display: flex; }
        
        /* 隱藏數字輸入框的上下小箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield; /* Firefox */
        }
    </style>
</head>

                    <button id="btnSlot14" onclick="selectSlot('14')" class="btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 bg-transparent text-gray-400 hover:text-white">

    <!-- Modal: Input Name Modal -->

                        <option value="Brimstone火殞">Brimstone火殞</option>

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        let app, db, auth;

                textColor: 'text-cyan-950',

                slots: [
                    { id: 'caller_1', name: 'CALLER', weapon: 'CALLER' },
                    { id: 'caller_2', name: '2 caller', weapon: '2 caller' }
                ]
            },
            {
                id: 'tank',
                title: 'TANK',
                icon: 'fa-shield-halved',
                headerColor: 'text-fuchsia-950',
                badgeBg: 'bg-fuchsia-800/20 text-fuchsia-950',
                containerStyle: 'background-color: #f5d0fe; border-color: #e879f9;',
                unfilledStyle: 'background-color: #fae8ff; border-color: #f0abfc;',
                filledStyle: 'background-color: #e879f9; border-color: #c026d3;',
                textColor: 'text-fuchsia-950',

                slots: [
                    { id: 'tank_1', name: '坦克坑 1', weapon: '單手錘/風暴錘/雷霆錘/正手/釘錘' },
                    { id: 'tank_2', name: '坦克坑 2', weapon: '單手錘/風暴錘/雷霆錘/正手/釘錘' },
                    { id: 'incubus_1', name: '縮小坦克', weapon: 'Incubus縮小' }
                ]
            },
            {

                filledStyle: 'background-color: #fbbf24; border-color: #d97706;',
                textColor: 'text-amber-950',

                    { id: 'dps_spike', name: '刺拳 (平10)', weapon: 'Spike刺拳 (平10)', fixedWeapon: true },

                    { id: 'dps_3', name: 'DPS 坑 3', weapon: '下拉選擇武器' },
                    { id: 'dps_4', name: 'DPS 坑 4', weapon: '下拉選擇武器' },
                    { id: 'dps_5', name: 'DPS 坑 5', weapon: '下拉選擇武器' },
                    { id: 'dps_6', name: 'DPS 坑 6', weapon: '下拉選擇武器' },

                ]

                containerStyle: 'background-color: #bfdbfe; border-color: #3b82f6;',

                filledStyle: 'background-color: #60a5fa; border-color: #2563eb;',
                textColor: 'text-blue-950',

                slots: [
                    { id: 'util_1', name: '索魂/斷水', weapon: 'Spirithunter索魂/Carving斷水' },
                    { id: 'util_2', name: '昭穎', weapon: 'shadowcaller昭穎' },
                    { id: 'util_3', name: '生咒', weapon: 'Corrupting Staff生咒' }
                ]
            },
            {
                id: 'healer',
                title: 'HEALER',
                icon: 'fa-heart-pulse',
                headerColor: 'text-emerald-950',
                badgeBg: 'bg-emerald-800/20 text-emerald-950',
                containerStyle: 'background-color: #a7f3d0; border-color: #10b981;',
                unfilledStyle: 'background-color: #d1fae5; border-color: #6ee7b7;',
                filledStyle: 'background-color: #34d399; border-color: #059669;',
                textColor: 'text-emerald-950',
                subTextColor: 'text-emerald-900',
                slots: [
                    { id: 'heal_0', name: '版甲墮神', weapon: 'HallowFall版甲墮神' },
                    { id: 'heal_1', name: '墮神', weapon: 'HallowFall墮神' },
                    { id: 'heal_2', name: '墮落法杖', weapon: 'Fallen墮落法杖' },
                    { id: 'heal_3', name: '水晶奶', weapon: '水晶奶' }
                ]
            },
            {
                id: 'flex',
                title: 'FLEX',
                icon: 'fa-users-gear',
                headerColor: 'text-purple-950',
                badgeBg: 'bg-purple-800/20 text-purple-950',
                containerStyle: 'background-color: #e9d5ff; border-color: #a855f7;',
                unfilledStyle: 'background-color: #f3e8ff; border-color: #d8b4fe;',
                filledStyle: 'background-color: #c084fc; border-color: #9333ea;',
                textColor: 'text-purple-950',
                subTextColor: 'text-purple-900',
                isFlexGroup: true,
                slots: [
                    { id: 'flex_1', name: '補位坑 1', weapon: '下拉選擇定位' },
                    { id: 'flex_2', name: '補位坑 2', weapon: '下拉選擇定位' },
                    { id: 'flex_3', name: '補位坑 3', weapon: '下拉選擇定位' },
                    { id: 'flex_4', name: '補位坑 4', weapon: '下拉選擇定位' },
                    { id: 'flex_5', name: '補位坑 5', weapon: '下拉選擇定位' }
                ]
            }
        ];

        // 綁定到 window 讓 HTML 內的 onclick 屬性可以順利調用
        window.selectSlot = selectSlot;
        window.selectMode = selectMode;
        window.openSlotModal = openSlotModal;
        window.closeModal = closeModal;
        window.updateRegearData = updateRegearData;
        window.confirmSlot = confirmSlot;
        window.clearSlot = clearSlot;
        window.exportToDiscord = exportToDiscord;
        window.clearAllOptions = clearAllOptions;

        let currentSlot = '12';
        let currentMode = 'roster'; // 'roster' | 'regear'
        let activeModalSlot = null;
        let activeIsDps = false;
        let activeIsFlex = false;

        let slotData = {
            '12': {},
            '14': {}
        };

        // 初始化 Firebase 實時同步
        async function initFirebase() {
            if (!firebaseConfig) {
                const connEl = document.getElementById('connectionStatus');
                if (connEl) connEl.innerHTML = '<span class="text-rose-400">🔴 離線 (僅本地)</span>';
                return;
            }
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // 監聽雲端資料變動 (實時拉取別人的更新)
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'roster', 'current');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        slotData = docSnap.data().slotData || { '12': {}, '14': {} };
                    }
                    renderBoard();
                    updateCounts();
                    const connEl = document.getElementById('connectionStatus');
                    if (connEl) connEl.innerHTML = '<span class="text-emerald-400">🟢 實時同步中</span>';
                }, (error) => {
                    console.error("Listen failed", error);
                    const connEl = document.getElementById('connectionStatus');
                    if (connEl) connEl.innerHTML = '<span class="text-rose-400">🔴 連線錯誤</span>';
                });
            } catch (error) {
                console.error("Firebase init failed", error);
                const connEl = document.getElementById('connectionStatus');
                if (connEl) connEl.innerHTML = '<span class="text-rose-400">🔴 認證失敗</span>';
            }
        }

        // 推送更新到雲端資料庫
        function saveToCloud() {
            if (!db || !auth || !auth.currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'roster', 'current');
            setDoc(docRef, { slotData }, { merge: true }).catch(e => console.error("Save error:", e));
        }

        // 立即啟動系統
        startClock();
        renderBoard();
        updateCounts();
        initFirebase();

        function startClock() {
            setInterval(() => {
                const now = new Date();
                const utcStr = now.toISOString().substr(11, 8) + ' UTC';
                const utcClockEl = document.getElementById('utcClock');
                if (utcClockEl) {
                    utcClockEl.innerText = utcStr;
                }

                const utcHour = now.getUTCHours();
                let targetHour = 12;
                if (utcHour >= 12 && utcHour < 14) {
                    targetHour = 14;
                } else if (utcHour >= 14) {
                    targetHour = 12;
                }

                const target = new Date(now);
                if (utcHour >= 14) {
                    target.setUTCDate(target.getUTCDate() + 1);
                }
                target.setUTCHours(targetHour, 0, 0, 0);

                const diff = target - now;
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                const ctaCountdownEl = document.getElementById('ctaCountdown');
                if (ctaCountdownEl) {
                    ctaCountdownEl.innerText = 
                        `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }
            }, 1000);
        }

        function selectMode(mode) {
            currentMode = mode;
            const btnRoster = document.getElementById('btnModeRoster');
            const btnRegear = document.getElementById('btnModeRegear');
            const rosterSummary = document.getElementById('rosterSummary');
            const regearSummary = document.getElementById('regearSummary');
            const btnExport = document.getElementById('btnExport');

            if (mode === 'roster') {
                btnRoster.className = 'btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg text-sm font-bold bg-amber-500 text-black shadow';
                btnRegear.className = 'btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg text-sm font-bold bg-transparent text-gray-400 hover:text-white';
                rosterSummary.classList.remove('hidden');
                regearSummary.classList.add('hidden');
                btnExport.classList.remove('hidden');
            } else {
                btnRegear.className = 'btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg text-sm font-bold bg-emerald-500 text-black shadow';
                btnRoster.className = 'btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg text-sm font-bold bg-transparent text-gray-400 hover:text-white';
                rosterSummary.classList.add('hidden');
                regearSummary.classList.remove('hidden');
                btnExport.classList.add('hidden');
            }
            renderBoard();
        }

        function selectSlot(time) {
            currentSlot = time;
            
            const btn12 = document.getElementById('btnSlot12');
            const btn14 = document.getElementById('btnSlot14');

            if (btn12 && btn14) {
                if (time === '12') {
                    btn12.className = 'btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow';
                    btn14.className = 'btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 bg-transparent text-gray-400 hover:text-white';
                } else {
                    btn14.className = 'btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow';
                    btn12.className = 'btn-action flex-1 sm:flex-initial px-5 py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 bg-transparent text-gray-400 hover:text-white';
                }
            }

            renderBoard();
            updateCounts();
        }

        function renderBoard() {
            const container = document.getElementById('compGridContainer');
            if (!container) return;

            // 紀錄當前獲得焦點的輸入框，防止實時同步時打字中斷
            const activeId = document.activeElement ? document.activeElement.id : null;
            container.innerHTML = '';

            const currentData = slotData[currentSlot] || {};

            COMP_CATEGORIES.forEach(cat => {
                const categorySection = document.createElement('div');
                categorySection.className = `p-4 rounded-2xl border space-y-3 shadow-md`;
                categorySection.style = cat.containerStyle;

                categorySection.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h2 class="font-extrabold ${cat.headerColor} flex items-center gap-2 text-sm md:text-base">
                            <i class="fa-solid ${cat.icon}"></i> ${cat.title}
                        </h2>
                        <span class="text-xs px-2.5 py-0.5 rounded-full font-bold font-mono ${cat.badgeBg}">
                            ${cat.slots.filter(s => currentData[s.id]?.name).length} / ${cat.slots.length}
                        </span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                        ${cat.slots.map(s => {
                            const occupied = currentData[s.id];
                            const styleStr = occupied ? cat.filledStyle : cat.unfilledStyle;
                            const displayWeapon = occupied?.selectedWeapon || s.weapon;
                            const isDpsSelectable = cat.isDpsGroup && !s.fixedWeapon;
                            const isFlexSelectable = cat.isFlexGroup;
                            
                            let cardContent = '';

                            if (currentMode === 'roster') {
                                cardContent = `
                                    <div class="text-xs font-black ${cat.subTextColor} truncate mb-1">
                                        ${displayWeapon}
                                    </div>
                                    ${occupied ? `
                                        <div class="flex items-center justify-between">
                                            <div class="font-black ${cat.textColor} truncate text-sm">
                                                👤 ${occupied.name}
                                            </div>
                                            <div class="flex items-center gap-1.5 text-xs font-bold font-mono ${cat.textColor}">
                                                <span class="truncate max-w-[80px]" title="${occupied.remark || ''}">${occupied.remark || ''}</span>
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="text-xs ${cat.subTextColor} italic font-semibold flex items-center gap-1">
                                            <i class="fa-solid fa-plus text-[10px]"></i> 點擊/click here
                                        </div>
                                    `}
                                `;
                            } else {
                                // Regear Mode
                                if (occupied) {
                                    const deaths = parseFloat(occupied.deaths) || 0;
                                    const gearCost = parseFloat(occupied.gearCost) || 0;
                                    const ocCost = parseFloat(occupied.ocCost) || 0;
                                    const totalCost = (deaths * gearCost) + ocCost;

                                    cardContent = `
                                        <div class="text-sm font-black ${cat.subTextColor} truncate mb-1">${displayWeapon}</div>
                                        <div class="font-black ${cat.textColor} truncate text-base">👤 ${occupied.name}</div>
                                        <div class="mt-2 space-y-1.5 pt-2 border-t border-black/10">
                                            <div class="flex justify-between items-center text-xs ${cat.textColor}">
                                                <span class="font-bold">死亡次數:</span>
                                                <input id="regear_deaths_${s.id}" type="number" min="0" step="1" value="${deaths}" onchange="updateRegearData('${s.id}', 'deaths', this.value)" class="w-14 bg-black/10 border border-black/20 rounded px-1.5 py-0.5 text-right font-mono outline-none text-black">
                                            </div>
                                            <div class="flex justify-between items-center text-xs ${cat.textColor}">
                                                <span class="font-bold">裝備 (M):</span>
                                                <input id="regear_gear_${s.id}" type="number" min="0" step="0.01" value="${gearCost}" onchange="updateRegearData('${s.id}', 'gearCost', this.value)" class="w-20 bg-black/10 border border-black/20 rounded px-1.5 py-0.5 text-right font-mono outline-none text-black">
                                            </div>
                                            <div class="flex justify-between items-center text-xs ${cat.textColor}">
                                                <span class="font-bold">OC Break (M):</span>
                                                <input id="regear_oc_${s.id}" type="number" min="0" step="0.01" value="${ocCost}" onchange="updateRegearData('${s.id}', 'ocCost', this.value)" class="w-20 bg-black/10 border border-black/20 rounded px-1.5 py-0.5 text-right font-mono outline-none text-black">
                                            </div>
                                            <div class="text-right text-sm font-black pt-1 ${totalCost > 0 ? 'text-rose-700' : cat.textColor}">
                                                總計: ${totalCost > 0 ? totalCost.toFixed(2) : '0'} M
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    cardContent = `
                                        <div class="text-sm font-black ${cat.subTextColor} truncate mb-1">${displayWeapon}</div>
                                        <div class="text-sm ${cat.subTextColor} italic font-semibold mt-2">❌ 空坑位</div>
                                    `;
                                }
                            }

                            const onClickAttr = (currentMode === 'roster') 
                                ? `onclick="openSlotModal('${s.id}', '${s.name}', '${s.weapon.replace(/'/g, "\\'")}', ${isDpsSelectable ? true : false}, ${isFlexSelectable ? true : false})"` 
                                : ``;

                            return `
                                <div ${onClickAttr} style="${styleStr}" class="slot-card relative shadow-sm ${currentMode === 'regear' && !occupied ? 'opacity-50' : ''}">
                                    ${cardContent}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;

                container.appendChild(categorySection);
            });

            // 如果原本有輸入框在打字中，恢復它的游標焦點
            if (activeId) {
                const el = document.getElementById(activeId);
                if (el) {
                    el.focus();
                }
            }
        }

        function openSlotModal(slotId, slotName, defaultWeapon, isDps = false, isFlex = false) {
            activeModalSlot = slotId;
            activeIsDps = isDps;
            activeIsFlex = isFlex;
            const currentData = slotData[currentSlot][slotId] || {};

            document.getElementById('modalRoleTitle').innerText = `坑位報名: ${slotName}`;
            document.getElementById('modalWeaponSub').innerText = isDps ? '請選擇具體的 DPS 武器類型' : (isFlex ? '請選擇補位之定位' : `武器要求: ${defaultWeapon}`);

            const dpsDropdown = document.getElementById('dpsWeaponDropdownContainer');
            if (isDps) {
                dpsDropdown.classList.remove('hidden');
                document.getElementById('modalInputWeapon').value = currentData.selectedWeapon || 'RiftGlaive刺刀';
            } else {
                dpsDropdown.classList.add('hidden');
            }

            const flexDropdown = document.getElementById('flexRoleDropdownContainer');
            if (isFlex) {
                flexDropdown.classList.remove('hidden');
                document.getElementById('modalInputFlexRole').value = currentData.selectedWeapon || 'TANK';
            } else {
                flexDropdown.classList.add('hidden');
            }

            document.getElementById('modalInputName').value = currentData.name || '';
            document.getElementById('modalInputRemark').value = currentData.remark || '';

            const btnClear = document.getElementById('btnClearSlot');
            if (currentData.name) {
                btnClear.classList.remove('hidden');
            } else {
                btnClear.classList.add('hidden');
            }

            const modal = document.getElementById('slotModal');
            modal.classList.add('flex');
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('slotModal');
            modal.classList.remove('flex');
            modal.style.display = 'none';
            activeModalSlot = null;
            activeIsDps = false;
            activeIsFlex = false;
        }

        function updateRegearData(slotId, field, value) {
            if (!slotData[currentSlot][slotId]) return;
            slotData[currentSlot][slotId][field] = parseFloat(value) || 0;
            renderBoard();
            updateCounts();
            saveToCloud();
        }

        function confirmSlot(e) {
            e.preventDefault();
            if (!activeModalSlot) return;

            const name = document.getElementById('modalInputName').value.trim();
            const remark = document.getElementById('modalInputRemark').value.trim();
            
            let selectedWeapon = null;
            if (activeIsDps) {
                selectedWeapon = document.getElementById('modalInputWeapon').value;
            } else if (activeIsFlex) {
                selectedWeapon = document.getElementById('modalInputFlexRole').value;
            }

            if (name) {
                // Keep existing regear data if editing
                const existing = slotData[currentSlot][activeModalSlot] || {};
                
                slotData[currentSlot][activeModalSlot] = {
                    name,
                    remark,
                    selectedWeapon,
                    deaths: existing.deaths || 0,
                    gearCost: existing.gearCost || 0,
                    ocCost: existing.ocCost || 0
                };
            }

            closeModal();
            renderBoard();
            updateCounts();
            saveToCloud();
        }

        function clearSlot() {
            if (!activeModalSlot) return;
            delete slotData[currentSlot][activeModalSlot];
            closeModal();
            renderBoard();
            updateCounts();
            saveToCloud();
        }

        function clearAllOptions() {
            if(confirm(`確定要清除 ${currentSlot}:00 UTC 的所有選項嗎？此操作將同步至雲端且無法復原！`)) {
                slotData[currentSlot] = {};
                renderBoard();
                updateCounts();
                saveToCloud();
            }
        }

        function updateCounts() {
            const data12 = slotData['12'];
            const data14 = slotData['14'];

            const count12 = Object.keys(data12).length;
            const count14 = Object.keys(data14).length;

            const el12 = document.getElementById('count12');
            const el14 = document.getElementById('count14');

            if (el12) el12.innerText = `${count12} 人`;
            if (el14) el14.innerText = `${count14} 人`;

            const totalSlotsCount = COMP_CATEGORIES.reduce((acc, cat) => acc + cat.slots.length, 0);
            const currentData = slotData[currentSlot] || {};
            const currentFilled = Object.keys(currentData).length;

            const elTotal = document.getElementById('totalCountDisplay');
            if (elTotal) elTotal.innerText = `${currentFilled} / ${totalSlotsCount}`;

            // 計算 Regear 總額
            let totalRegear = 0;
            Object.values(currentData).forEach(occupied => {
                const d = parseFloat(occupied.deaths) || 0;
                const gc = parseFloat(occupied.gearCost) || 0;
                const oc = parseFloat(occupied.ocCost) || 0;
                totalRegear += (d * gc) + oc;
            });
            const elRegear = document.getElementById('totalRegearDisplay');
            if (elRegear) elRegear.innerText = (totalRegear > 0 ? totalRegear.toFixed(2) : '0') + ' M';
        }

        function exportToDiscord() {
            const currentData = slotData[currentSlot];
            let text = `⚔️ **【Albion Online】${currentSlot}:00 UTC CTA 陣容名單** ⚔️\n`;
            text += `----------------------------------------\n`;

            COMP_CATEGORIES.forEach(cat => {
                text += `**${cat.title}**\n`;
                cat.slots.forEach(s => {
                    const filled = currentData[s.id];
                    const weaponName = filled?.selectedWeapon || s.weapon;
                    if (filled) {
                        const remarkText = filled.remark ? ` (${filled.remark})` : '';
                        text += `  • [${weaponName}] ${filled.name}${remarkText}\n`;
                    } else {
                        text += `  • [${weaponName}] ❌ *【空位】*\n`;
                    }
                });
                text += `\n`;
            });

            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            alert(`✅ ${currentSlot}:00 UTC 名單已成功複製！直接至 Discord 貼上即可。`);
        }
    </script>
</body>
</html>
