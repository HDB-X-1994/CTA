<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- 引入 Firebase SDK (兼容版本) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
        .slot-card { cursor: pointer; padding: 0.75rem; border-radius: 0.75rem; border-width: 1px; border-style: solid; transition: all 0.2s; }
        .slot-card:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .btn-action { transition: all 0.2s; cursor: pointer; }
        .btn-action:hover { opacity: 0.9; }
        .modal-backdrop { position: fixed; inset: 0; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .modal-backdrop.flex { display: flex; }
        /* 隐藏数字输入框的小箭头 */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- 頂部 Header -->
        <div class="bg-gradient-to-r from-gray-900 via-gray-850 to-gray-900 p-4 md:p-6 rounded-2xl border border-gray-800 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl font-black">
                    <i class="fa-solid fa-shield-cat"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-white flex items-center gap-2">
                        HDB X 1994
                    </h1>
                    <p class="text-xs text-gray-400">12:00 UTC & 14:00 UTC 雙場次即時坑位預約與戰損結算</p>
                </div>
            </div>

            <!-- Firebase 連線狀態 -->
            <div class="flex items-center gap-4 text-xs font-mono">
                <div class="bg-black/50 px-3 py-1.5 rounded-lg border border-gray-800" id="connectionStatus">
                    連線：<span class="text-rose-500">🔴 離線 (僅本地)</span>
                </div>
            </div>
        </div>

        <!-- 模式與場次切換列 -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 bg-gray-900 p-4 rounded-2xl border border-gray-800">
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                <!-- UTC 切換 -->
                <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 w-full sm:w-auto">
                    <button id="btnSlot12" onclick="selectSlot('12')" class="btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow">
                        <i class="fa-solid fa-crosshairs"></i> 12:00 UTC (<span id="count12">0 人</span>)
                    </button>
                    <button id="btnSlot14" onclick="selectSlot('14')" class="btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg font-bold flex items-center justify-center gap-2 bg-transparent text-gray-400 hover:text-white">
                        <i class="fa-solid fa-crosshairs"></i> 14:00 UTC (<span id="count14">0 人</span>)
                    </button>
                </div>
                <div class="hidden sm:block w-px h-8 bg-gray-800"></div>
                <!-- 報名/結算 模式切換 -->
                <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 w-full sm:w-auto">
                    <button id="btnModeRoster" onclick="selectMode('roster')" class="btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-bold bg-amber-500 text-black shadow flex items-center justify-center gap-2">
                        <i class="fa-solid fa-users"></i> 陣容報名
                    </button>
                    <button id="btnModeRegear" onclick="selectMode('regear')" class="btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-bold bg-transparent text-gray-400 hover:text-white flex items-center justify-center gap-2">
                        <i class="fa-solid fa-coins"></i> Regear 結算
                    </button>
                </div>
            </div>

            <!-- 右側統計與按鈕 -->
            <div class="flex items-center justify-between sm:justify-end gap-4 w-full md:w-auto">
                <div id="rostersSummary" class="text-right">
                    <span class="text-xs text-gray-400 block font-semibold">當前場次入坑人數</span>
                    <span id="totalCountDisplay" class="text-lg font-black text-amber-400 font-mono">0 / 25</span>
                </div>
                <div id="regearsSummary" class="text-right hidden">
                    <span class="text-xs text-gray-400 block font-semibold">本場賠付總額</span>
                    <span id="totalRegearDisplay" class="text-lg font-black text-emerald-400 font-mono">0 M</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="clearAllData()" class="btn-action px-3 py-2.5 bg-rose-900/50 hover:bg-rose-800 text-rose-300 font-bold rounded-xl shadow flex items-center justify-center text-sm border border-rose-700/50" title="清除當前場次所有選項">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <button id="btnExport" onclick="exportToDiscord()" class="btn-action px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow flex items-center justify-center gap-2 text-sm">
                        <i class="fa-brands fa-discord text-base"></i> 複製名單
                    </button>
                </div>
            </div>
        </div>

        <!-- 陣容主區域 -->
        <div id="compGridContainer" class="space-y-4"></div>
    </div>

    <!-- 報名彈窗 -->
    <div id="slotModal" class="modal-backdrop">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <div>
                    <h3 id="modalRoleTitle" class="text-lg font-bold text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-crosshairs"></i> 選擇坑位報名
                    </h3>
                    <p id="modalWeaponSub" class="text-xs text-gray-400 mt-0.5"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form onsubmit="confirmSlot(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-300 block mb-1">玩家 ID (In-Game ID)</label>
                    <input type="text" id="modalInputName" required placeholder="例如: FuDog" 
                           class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-amber-500 outline-none">
                </div>

                <!-- 武器選擇下拉菜單 (DPS & FLEX 共用容器，選項透過 JS 動態切換) -->
                <div id="dropdownContainer" class="hidden">
                    <label class="text-xs font-bold text-amber-400 block mb-1">選擇定位/武器</label>
                    <select id="modalInputWeapon" class="w-full bg-gray-950 border border-amber-500/50 rounded-xl px-3 py-2.5 text-sm text-amber-200 focus:border-amber-400 outline-none">
                    </select>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-300 block mb-1">備註</label>
                    <input type="text" id="modalInputRemark" placeholder="例如: 迟到" 
                           class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:border-amber-500 outline-none">
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-black font-black rounded-xl shadow transition">
                        確認
                    </button>
                    <button type="button" id="btnClearSlot" onclick="clearSlot()" class="hidden py-2.5 px-4 bg-rose-900/50 hover:bg-rose-800 text-rose-300 font-bold rounded-xl border border-rose-700/50 transition">
                        清空此坑
                    </button>
                </div>
            </form>
        </div>
    </div>

            connectedRef.on("value", (snap) => {

                filledStyle: 'background-color: #60a5fa; border-color: #2563eb;',
                textColor: 'text-blue-950', subTextColor: 'text-blue-900',
                slots: [
                    { id: 'util_1', name: '索魂/斷水', weapon: 'Spirithunter索魂/Carving斷水' },
                    { id: 'util_2', name: '昭穎', weapon: 'shadowcaller昭穎' },

                ]

                slots: [

                    { id: 'heal_1', name: '墮神', weapon: 'HallowFall墮神' },
                    { id: 'heal_2', name: '墮落法杖', weapon: 'Fallen墮落法杖' },
                    { id: 'heal_3', name: '水晶奶', weapon: '水晶奶' }
                ]
            },
            {
                id: 'flex', title: 'FLEX', icon: 'fa-users-gear',

                unfilledStyle: 'background-color: #f3e8ff; border-color: #d8b4fe;',
                filledStyle: 'background-color: #c084fc; border-color: #9333ea;',
                textColor: 'text-purple-950', subTextColor: 'text-purple-900',
                slots: [
                    { id: 'flex_1', name: '補位坑 1', weapon: '定位下拉', dropdownType: 'flex' },
                    { id: 'flex_2', name: '補位坑 2', weapon: '定位下拉', dropdownType: 'flex' },
                    { id: 'flex_3', name: '補位坑 3', weapon: '定位下拉', dropdownType: 'flex' },
                    { id: 'flex_4', name: '補位坑 4', weapon: '定位下拉', dropdownType: 'flex' },
                    { id: 'flex_5', name: '補位坑 5', weapon: '定位下拉', dropdownType: 'flex' }
                ]
            }
        ];

        let currentSlot = '12';
        let currentMode = 'roster';
        let activeModalSlot = null;
        let activeDropdownType = 'none';

        // 預設本地資料
        let slotData = { '12': {}, '14': {} };

        window.addEventListener('DOMContentLoaded', () => {
            initData();
        });

        // 初始化資料 (根據連線狀態選擇 Firebase 或 LocalStorage)
        function initData() {
            if (db && isOnline) {
                db.ref('hdb1994_roster').on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        slotData = snapshot.val();
                        if (!slotData['12']) slotData['12'] = {};
                        if (!slotData['14']) slotData['14'] = {};
                    } else {
                        slotData = { '12': {}, '14': {} };
                    }
                    renderBoard();
                    updateCounts();
                });
            } else {
                const localData = localStorage.getItem('hdb1994_roster');
                if (localData) slotData = JSON.parse(localData);
                renderBoard();
                updateCounts();
            }
        }

        // 保存資料函數
        function saveData() {
            if (db && isOnline) {
                db.ref('hdb1994_roster').set(slotData);
            } else {
                localStorage.setItem('hdb1994_roster', JSON.stringify(slotData));
            }
            renderBoard();
            updateCounts();
        }

        function selectMode(mode) {
            currentMode = mode;
            const btnRoster = document.getElementById('btnModeRoster');
            const btnRegear = document.getElementById('btnModeRegear');
            const rostersSummary = document.getElementById('rostersSummary');
            const regearsSummary = document.getElementById('regearsSummary');
            const btnExport = document.getElementById('btnExport');

            if (mode === 'roster') {
                btnRoster.className = 'btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-bold bg-amber-500 text-black shadow flex items-center justify-center gap-2';
                btnRegear.className = 'btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-bold bg-transparent text-gray-400 hover:text-white flex items-center justify-center gap-2';
                rostersSummary.classList.remove('hidden');
                regearsSummary.classList.add('hidden');
                btnExport.classList.remove('hidden');
            } else {
                btnRegear.className = 'btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-bold bg-emerald-500 text-black shadow flex items-center justify-center gap-2';
                btnRoster.className = 'btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg text-sm font-bold bg-transparent text-gray-400 hover:text-white flex items-center justify-center gap-2';
                rostersSummary.classList.add('hidden');
                regearsSummary.classList.remove('hidden');
                btnExport.classList.add('hidden');
            }
            renderBoard();
        }

        function selectSlot(time) {
            currentSlot = time;
            const btn12 = document.getElementById('btnSlot12');
            const btn14 = document.getElementById('btnSlot14');

            if (time === '12') {
                btn12.className = 'btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow';
                btn14.className = 'btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg font-bold flex items-center justify-center gap-2 bg-transparent text-gray-400 hover:text-white';
            } else {
                btn14.className = 'btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow';
                btn12.className = 'btn-action flex-1 sm:flex-initial px-5 py-2 rounded-lg font-bold flex items-center justify-center gap-2 bg-transparent text-gray-400 hover:text-white';
            }
            renderBoard();
            updateCounts();
        }

        function updateRegearData(slotId, field, value) {
            if (!slotData[currentSlot][slotId]) return;
            const numVal = parseFloat(value) || 0;
            slotData[currentSlot][slotId][field] = numVal;
            saveData();
        }

        function renderBoard() {
            const container = document.getElementById('compGridContainer');
            if (!container) return;
            container.innerHTML = '';

            const currentData = slotData[currentSlot] || {};
            let totalRegearMoney = 0;

            COMP_CATEGORIES.forEach(cat => {
                const categorySection = document.createElement('div');
                categorySection.className = `p-4 rounded-2xl border space-y-3 shadow-md`;
                categorySection.style = cat.containerStyle;

                categorySection.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h2 class="font-extrabold ${cat.headerColor} flex items-center gap-2 text-sm md:text-base">
                            <i class="fa-solid ${cat.icon}"></i> ${cat.title}
                        </h2>
                        <span class="text-xs px-2.5 py-0.5 rounded-full font-bold font-mono ${cat.badgeBg}">
                            ${cat.slots.filter(s => currentData[s.id]?.name).length} / ${cat.slots.length}
                        </span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                        ${cat.slots.map(s => {
                            const occupied = currentData[s.id];
                            const styleStr = occupied ? cat.filledStyle : cat.unfilledStyle;
                            const displayWeapon = occupied?.selectedWeapon || s.weapon;
                            
                            if (currentMode === 'roster') {
                                return `
                                    <div onclick="openSlotModal('${s.id}', '${s.name}', '${s.weapon.replace(/'/g, "\\'")}', '${s.dropdownType || 'none'}')" 
                                         style="${styleStr}" class="slot-card relative shadow-sm min-h-[70px]">
                                        <div class="text-xs font-black ${cat.subTextColor} truncate mb-1">
                                            ${displayWeapon}
                                        </div>
                                        ${occupied ? `
                                            <div class="flex items-center justify-between">
                                                <div class="font-black ${cat.textColor} truncate text-sm">👤 ${occupied.name}</div>
                                                <div class="flex items-center gap-1.5 text-xs font-bold font-mono ${cat.textColor}">
                                                    <span class="truncate max-w-[80px]" title="${occupied.remark || ''}">${occupied.remark || ''}</span>
                                                </div>
                                            </div>
                                        ` : `
                                            <div class="text-xs ${cat.subTextColor} italic font-semibold mt-1">點擊/click here</div>
                                        `}
                                    </div>
                                `;
                            } else {
                                // Regear 模式
                                if (!occupied) {
                                    return `
                                        <div style="${cat.unfilledStyle}" class="slot-card relative shadow-sm opacity-60 min-h-[90px]">
                                            <div class="text-xs font-black ${cat.subTextColor} truncate mb-1">${displayWeapon}</div>
                                            <div class="text-xs ${cat.subTextColor} italic font-semibold mt-1">無人報名</div>
                                        </div>
                                    `;
                                } else {
                                    const dCount = parseFloat(occupied.deaths) || 0;
                                    const pCost = parseFloat(occupied.price) || 0;
                                    const pOc = parseFloat(occupied.ocPrice) || 0;
                                    const totalForPlayer = (dCount * pCost) + pOc;
                                    totalRegearMoney += totalForPlayer;

                                    return `
                                        <div style="${cat.filledStyle}" class="slot-card relative shadow-sm flex flex-col justify-between min-h-[140px]">
                                            <div>
                                                <div class="text-xs font-black ${cat.subTextColor} truncate mb-0.5">${displayWeapon}</div>
                                                <div class="font-black ${cat.textColor} truncate text-sm">👤 ${occupied.name}</div>
                                            </div>
                                            <div class="mt-2 pt-2 border-t border-black/10 space-y-2">
                                                <div class="flex items-center gap-2">
                                                    <div class="flex-1">
                                                        <span class="text-[12px] ${cat.subTextColor} block font-bold">死亡次數</span>
                                                        <input type="number" min="0" step="1" value="${dCount}" onchange="updateRegearData('${s.id}', 'deaths', this.value)" 
                                                               class="w-full bg-white/40 border-none rounded px-2 py-1 ${cat.textColor} font-bold text-sm outline-none placeholder-black/30">
                                                    </div>
                                                    <div class="flex-1">
                                                        <span class="text-[12px] ${cat.subTextColor} block font-bold">金額 (M)</span>
                                                        <input type="number" min="0" step="0.1" value="${pCost}" onchange="updateRegearData('${s.id}', 'price', this.value)" 
                                                               class="w-full bg-white/40 border-none rounded px-2 py-1 ${cat.textColor} font-bold text-sm outline-none placeholder-black/30">
                                                    </div>
                                                    <div class="flex-1">
                                                        <span class="text-[12px] ${cat.subTextColor} block font-bold">OC (M)</span>
                                                        <input type="number" min="0" step="0.1" value="${pOc}" onchange="updateRegearData('${s.id}', 'ocPrice', this.value)" 
                                                               class="w-full bg-white/40 border-none rounded px-2 py-1 ${cat.textColor} font-bold text-sm outline-none placeholder-black/30">
                                                    </div>
                                                </div>
                                                <div class="flex justify-between items-center text-sm font-black pt-1">
                                                    <span class="${cat.subTextColor}">總計:</span>
                                                    <span class="${cat.textColor}">${totalForPlayer.toFixed(2)} M</span>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }
                            }
                        }).join('')}
                    </div>
                `;
                container.appendChild(categorySection);
            });

            if (currentMode === 'regear') {
                document.getElementById('totalRegearDisplay').innerText = `${totalRegearMoney.toFixed(2)} M`;
            }
        }

        function openSlotModal(slotId, slotName, defaultWeapon, dropdownType) {
            activeModalSlot = slotId;
            activeDropdownType = dropdownType;
            const currentData = slotData[currentSlot][slotId] || {};

            document.getElementById('modalRoleTitle').innerText = `坑位報名: ${slotName}`;
            document.getElementById('modalWeaponSub').innerText = dropdownType !== 'none' ? '請從下拉選單選擇' : `定位: ${defaultWeapon}`;

            const dropdownContainer = document.getElementById('dropdownContainer');
            const selectEl = document.getElementById('modalInputWeapon');
            
            if (dropdownType === 'dps') {
                dropdownContainer.classList.remove('hidden');
                selectEl.innerHTML = DPS_OPTIONS.map(opt => `<option value="${opt}">${opt}</option>`).join('');
                selectEl.value = currentData.selectedWeapon || 'RiftGlaive刺刀';
            } else if (dropdownType === 'flex') {
                dropdownContainer.classList.remove('hidden');
                selectEl.innerHTML = FLEX_OPTIONS.map(opt => `<option value="${opt}">${opt}</option>`).join('');
                selectEl.value = currentData.selectedWeapon || 'TANK';
            } else {
                dropdownContainer.classList.add('hidden');
            }

            document.getElementById('modalInputName').value = currentData.name || '';
            document.getElementById('modalInputRemark').value = currentData.remark || '';

            const btnClear = document.getElementById('btnClearSlot');
            if (currentData.name) btnClear.classList.remove('hidden');
            else btnClear.classList.add('hidden');

            const modal = document.getElementById('slotModal');
            modal.classList.add('flex');
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('slotModal');
            modal.classList.remove('flex');
            modal.style.display = 'none';
            activeModalSlot = null;
            activeDropdownType = 'none';
        }

        function confirmSlot(e) {
            e.preventDefault();
            if (!activeModalSlot) return;

            const name = document.getElementById('modalInputName').value.trim();
            const remark = document.getElementById('modalInputRemark').value.trim();
            const selectedWeapon = activeDropdownType !== 'none' ? document.getElementById('modalInputWeapon').value : null;

            if (name) {
                // 保留該坑位已有的結算數據
                const existingData = slotData[currentSlot][activeModalSlot] || { deaths: 0, price: 0, ocPrice: 0 };
                slotData[currentSlot][activeModalSlot] = {
                    ...existingData,
                    name,
                    remark,
                    selectedWeapon
                };
            }

            saveData();
            closeModal();
        }

        function clearSlot() {
            if (!activeModalSlot) return;
            delete slotData[currentSlot][activeModalSlot];
            saveData();
            closeModal();
        }

        function clearAllData() {
            if (confirm(`⚠️ 警告！你確定要清除【${currentSlot}:00 UTC】的所有報名與結算數據嗎？\n(清除後所有人畫面都會被同步清空)`)) {
                slotData[currentSlot] = {};
                saveData();
                alert(`已清除 ${currentSlot}:00 UTC 的所有數據！`);
            }
        }

        function updateCounts() {
            const data12 = slotData['12'] || {};
            const data14 = slotData['14'] || {};

            const count12 = Object.keys(data12).length;
            const count14 = Object.keys(data14).length;

            const el12 = document.getElementById('count12');
            const el14 = document.getElementById('count14');

            if (el12) el12.innerText = `${count12} 人`;
            if (el14) el14.innerText = `${count14} 人`;

            const totalSlotsCount = COMP_CATEGORIES.reduce((acc, cat) => acc + cat.slots.length, 0);
            const currentFilled = Object.keys(slotData[currentSlot] || {}).length;

            const elTotal = document.getElementById('totalCountDisplay');
            if (elTotal) elTotal.innerText = `${currentFilled} / ${totalSlotsCount}`;
        }

        function exportToDiscord() {
            const currentData = slotData[currentSlot];
            let text = `⚔️ **【Albion Online】${currentSlot}:00 UTC CTA 陣容名單** ⚔️\n`;
            text += `----------------------------------------\n`;

            COMP_CATEGORIES.forEach(cat => {
                text += `**${cat.title}**\n`;
                cat.slots.forEach(s => {
                    const filled = currentData[s.id];
                    const weaponName = filled?.selectedWeapon || s.weapon;
                    if (filled) {
                        const remarkText = filled.remark ? ` (${filled.remark})` : '';
                        text += `  • [${weaponName}] ${filled.name}${remarkText}\n`;
                    } else {
                        text += `  • [${weaponName}] ❌ *【空位】*\n`;
                    }
                });
                text += `\n`;
            });

            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            alert(`✅ ${currentSlot}:00 UTC 名單已成功複製！直接至 Discord 貼上即可。`);
        }
    </script>
</body>
</html>
